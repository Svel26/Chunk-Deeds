name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract tag metadata
        id: metadata
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "${TAG}" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build
        run: ./gradlew clean build -Pmod_version="${{ steps.metadata.outputs.version }}" --no-daemon

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: Chunk Deeds v${{ steps.metadata.outputs.version }}
          generate_release_notes: true
          files: |
            build/libs/*.jar

      - name: Resolve Modrinth config
        id: modrinth_config
        shell: bash
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -n "${MODRINTH_PROJECT_ID}" ] && [ -n "${MODRINTH_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "project_id=${MODRINTH_PROJECT_ID}" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "project_id=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish to Modrinth
        if: ${{ steps.modrinth_config.outputs.enabled == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.modrinth_config.outputs.project_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
            build/libs/*-@(dev|sources|javadoc).jar
          name: Chunk Deeds ${{ steps.metadata.outputs.version }}
          version: ${{ steps.metadata.outputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: |
            fabric
          game-versions: |
            1.21.1
          java: |
            21

      - name: Skip Modrinth publish (missing credentials)
        if: ${{ steps.modrinth_config.outputs.enabled != 'true' }}
        run: echo "::notice::Skipping Modrinth publish because MODRINTH_TOKEN and MODRINTH_PROJECT_ID are not fully configured."
