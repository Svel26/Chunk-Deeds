name: Feature Request
description: Suggest an idea or feature for Chunk Deeds.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea for Chunk Deeds!
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: A clear and concise description of what you would like to happen.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale / Use Case
      description: Why would this feature be useful for servers or players?
    validations:
      required: false
