plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

def getModVersion() {
    // 1. Explicit property override (e.g. -Pmod_version=X.Y.Z)
    if (project.hasProperty("mod_version") && project.property("mod_version")) {
        return project.property("mod_version")
    }
    // 2. GitHub Release tag (e.g. GITHUB_REF_NAME=v1.0.0 -> 1.0.0)
    def githubRef = System.getenv("GITHUB_REF_NAME")
    if (githubRef != null && githubRef.startsWith("v")) {
        return githubRef.substring(1)
    }
    // 3. Fallback
    return "0.0.0-SNAPSHOT"
}

version = getModVersion()
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }
    maven {
        name = "Latvian Maven"
        url = "https://maven.latvian.dev/"
    }
    maven {
        name = "Saps Maven"
        url = "https://maven.saps.dev/minecraft"
    }
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    // Environment
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config (optional / compile-time)
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // JEI (optional / compile-time)
    modCompileOnly("mezz.jei:jei-1.21.1-fabric:${project.jei_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
